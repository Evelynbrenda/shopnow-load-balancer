# Round Robin: algoritmo padrão do nginx (sem diretiva).
upstream round_robin {
    zone round_robin 64k;  # estado compartilhado entre os workers do nginx
    # Health check passivo: 1 falha tira o servidor da rotação por 10 s.
    server servidor1 max_fails=1 fail_timeout=10s;
    server servidor2 max_fails=1 fail_timeout=10s;
    server servidor3 max_fails=1 fail_timeout=10s;
}

# Least Connections: escolhe o servidor com menos requisições em andamento.
upstream least_connections {
    zone least_connections 64k;  # estado compartilhado entre os workers do nginx
    least_conn;
    server servidor1 max_fails=1 fail_timeout=10s;
    server servidor2 max_fails=1 fail_timeout=10s;
    server servidor3 max_fails=1 fail_timeout=10s;
}

# IP Hash: o mesmo IP de cliente cai sempre no mesmo servidor (afinidade de sessão).
upstream ip_hash {
    zone ip_hash 64k;  # estado compartilhado entre os workers do nginx
    ip_hash;
    server servidor1 max_fails=1 fail_timeout=10s;
    server servidor2 max_fails=1 fail_timeout=10s;
    server servidor3 max_fails=1 fail_timeout=10s;
}

# Converte ?algorithm=... no nome do upstream (sem parâmetro = round_robin).
map $arg_algorithm $backend {
    ""                round_robin;
    round_robin       round_robin;
    least_connections least_connections;
    ip_hash           ip_hash;
    default           invalid;
}

server {
    listen 80;

    location / {
        # Só vale para respostas geradas pelo nginx (o 400 abaixo);
        # respostas dos servidores mantêm o próprio Content-Type.
        default_type application/json;

        if ($backend = invalid) {
            return 400 '{"error":"Algoritmo inválido.","allowed":["round_robin","least_connections","ip_hash"]}';
        }

        proxy_pass http://$backend;
        proxy_set_header Host $host;

        # Servidor fora do ar: desiste rápido e tenta o próximo.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
